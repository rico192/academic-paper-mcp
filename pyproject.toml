[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-paper-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for searching, ranking, citing, and downloading academic research papers across arXiv, OpenAlex, Crossref, Semantic Scholar, and Scopus (Elsevier)."
readme = "README.md"
authors = [
    { name = "Rico (DPM Research)", email = "rico@dpm.web.id" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/rico192/academic-paper-mcp"
Issues = "https://github.com/rico192/academic-paper-mcp/issues"

[project.scripts]
academic-paper-mcp = "academic_paper_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
