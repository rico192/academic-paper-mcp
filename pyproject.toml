[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-paper-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for searching, ranking, citing, and downloading academic research papers across arXiv, OpenAlex, Crossref, and Semantic Scholar."
readme = "README.md"
authors = [
    { name = "Academic MCP Contributor" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
academic-paper-mcp = "academic_paper_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
